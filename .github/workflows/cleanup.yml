name: DB Cleanup

on:
  schedule:
    # 15:00 UTC equivale às 12:00 no Horário de Brasília (UTC-3)
    - cron: '0 15 * * 0' 
  workflow_dispatch: # Permite disparar manualmente para testar

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências do Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Limpeza do Banco
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/cleanup.py